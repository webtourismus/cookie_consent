    weight: 0
    consent_signals:
      - security_storage
  functional:
    label: 'Funktional'
    description: 'Ermöglichen zusätzliche Funktionen und persönliche Einstellungen, zum Beispiel Chat- oder Buchungs-Widgets.'
    required: false
    weight: 1
    consent_signals:
      - functionality_storage
      - personalization_storage
  analytics:
    label: 'Statistik'
    description: 'Helfen uns zu verstehen, wie Besucher die Website nutzen. Die Informationen werden zusammengefasst ausgewertet und helfen uns, die Website zu verbessern.'
    required: false
    weight: 2
    consent_signals:
      - analytics_storage
  marketing:
    label: 'Marketing'
    description: 'Werden verwendet, um die Wirkung unserer Werbung zu messen und Ihnen auf anderen Websites relevante Angebote anzuzeigen.'
    required: false
