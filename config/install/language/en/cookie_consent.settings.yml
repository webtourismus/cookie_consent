categories:
  necessary:
    label: 'Necessary'
    description: 'These cookies and services are required to run the website, for example to store your cookie choice. They cannot be disabled.'
  functional:
    label: 'Functional'
    description: 'Enable additional features and personal settings, for example chat or booking widgets.'
  analytics:
    label: 'Statistics'
    description: 'Help us understand how visitors use the website. The information is evaluated in aggregate and helps us improve the website.'
  marketing:
    label: 'Marketing'
    description: 'Used to measure the effect of our advertising and to show you relevant offers on other websites.'
  external_media:
    label: 'External media'
    description: 'Content of video and map platforms such as YouTube or Google Maps. Loading it transfers data to the respective provider.'
texts:
  consent_title: 'We respect your privacy'
  consent_description: 'We use cookies and similar technologies to improve our website, analyse traffic and show content of external providers such as videos and maps. With “Accept all” you agree to all purposes. With “Reject all” we only use necessary cookies. You can change your choice at any time via “Cookies” at the bottom of the page.'
  revision_message: 'We have updated our privacy information. Please confirm your choice again.'
  accept_all: 'Accept all'
  reject_all: 'Reject all'
  show_preferences: 'Settings'
  preferences_title: 'Cookie settings'
  preferences_description: 'Choose which cookies and services we may use. Necessary cookies are always active. Your consent is voluntary and can be withdrawn at any time with effect for the future.'
  save_preferences: 'Save selection'
  more_title: 'Your stored choice'
  more_description: 'Your consent is logged with a random ID so that we can prove it. No personal data such as your IP address is stored.'
  embed_text: 'Content of @service is shown here. Loading it transfers data to @provider.'
